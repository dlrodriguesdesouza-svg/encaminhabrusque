name: Deploy EncaminhaBrusque to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package approved static site files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          pages=(index.html metodos.html testagem-e-prevencao.html urgencia.html videos.html referencias.html)
          cp "${pages[@]}" CNAME _site/
          cp -R css js assets _site/
          for page in "${pages[@]}"; do
            test -s "_site/$page"
            grep -Fq 'noindex, nofollow' "_site/$page"
          done
          test -s _site/CNAME
          grep -Fqx 'encaminhabrusque.com.br' _site/CNAME
          echo "Publishing only site assets; editorial documents remain out of the Pages artifact."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
